name: MLOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute ML pipeline
        run: |
          # Si un remote de stockage cloud (S3/GCS/Drive) est configuré avec des secrets :
          # dvc pull
          dvc repro

      - name: Show metrics
        run: |
          dvc metrics show

